{% extends "base.html" %}
{% block title %}Reset password | BuildCost{% endblock %}
{% block content %}
<section class="auth-layout page-shell"><div class="auth-intro"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new <em>password.</em></h1><p>Your reset link is valid for 30 minutes and can only be used once.</p></div><div class="auth-panel"><div class="auth-panel-head"><span class="panel-kicker">NEW PASSWORD</span><h2>Reset password</h2></div><form id="reset-password-form" class="auth-form"><label for="reset-password">New password</label><input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="At least 8 characters"><button class="button form-button" type="submit">Update password <span aria-hidden="true">&#8594;</span></button><p class="form-message" role="alert" aria-live="polite"></p></form></div></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='auth.js') }}"></script>{% endblock %}
